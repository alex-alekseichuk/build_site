<sites> 
        <default>
                delete_allowed no
                #frontend skinny
                <dbic>
                        <company>
                           <list_returns>
                             company_id id
                             company_nickname nickname
                             legal_name legal name
                           </list_returns>
                           <auto_ctime>
                             editable no
                           </auto_ctime>
                           <auto_mtime>
                             editable no
                           </auto_mtime>
                        </company>
                        <product>
                           <list_returns>
                             product_id id
                             product_name name
                           </list_returns>
                           
                        </product>
                        <file>
                          hidden yes
                        </file>
                        <package_item>
                          hidden yes
                        </package_item>
                        <account_private_location>
                          hidden yes
                        </account_private_location>
                        <account_location>
                          hidden yes
                        </account_location>
                        <account_user>
                          hidden yes
                        </account_user>
                        <addressbook_company>
                          hidden yes
                        </addressbook_company>
                        <addressbook_person>
                          hidden yes
                        </addressbook_person>
                </dbic>
        </default>
        <userdata>

        </userdata>
</sites>